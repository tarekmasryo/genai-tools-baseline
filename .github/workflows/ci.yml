name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  
jobs:
  validate-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate notebook syntax
        run: python scripts/validate_notebook.py generative-ai-tools-platforms-2025-eda-baseline.ipynb
